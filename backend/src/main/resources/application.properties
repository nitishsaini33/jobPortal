# ========================================
# SmartHire Portal — Application Properties
# ========================================

# ---- Server Configuration ----
server.port=8080
spring.application.name=SmartHire Portal

# ---- MySQL Datasource ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarthire_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- SQL Initialization ----
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# ---- JWT Configuration ----
app.jwt.secret=SmartHireSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024!
app.jwt.expiration-ms=86400000

# ---- File Upload Configuration ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads/resumes

# ---- Logging ----
logging.level.com.smarthire=DEBUG
logging.level.org.springframework.security=DEBUG
